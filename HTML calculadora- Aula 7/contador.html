<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contador de cliques</title>
</head>
   <body>
       <main class="container">
        <h1>Contador de cliques</h1>
        <p id="contador">0</p>
        <p class="descricao">Use os botões para alterar o valor</p>
        <div class="botoes">
            <button class="botao botao-secundario" id="diminuir" type="button">− Diminuir</button>
            <button class="botao botao-reset" id="zerar" type="button">Resetar</button>
            <button class="botao botao-principal" id="aumentar" type="button">+ Aumentar</button>
        </div>
       </main>
       <script src="js.js"></script>
</body>
</html>
